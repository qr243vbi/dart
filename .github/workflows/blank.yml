name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Generate release tag
        id: release
        shell: bash
        run: |
          TAG="v$(date -u +'%Y%m%d-%H%M%S')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Install and initialize depot_tools
        shell: bash
        run: |
          git clone \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$RUNNER_TEMP/depot_tools"

          export PATH="$RUNNER_TEMP/depot_tools:$PATH"

          ./../depot_tools/ensure_bootstrap 2>/dev/null || \
            "$RUNNER_TEMP/depot_tools/ensure_bootstrap"

          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"

      - name: Check out repository for tagging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch Dart source
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          mkdir dart-checkout
          cd dart-checkout

          fetch dart
          gclient sync

      - name: Create source tarball (xz, high compression, exclude .git)
        working-directory: ${{ runner.temp }}
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          # Create a .tar.xz archive with high compression and exclude the .git directory
          tar --exclude='.git' -cf - dart-checkout | xz -9e -c > "$GITHUB_WORKSPACE/dart-source-${TAG}.tar.xz"

      - name: Generate SHA-256 checksum
        env:
          TAG: ${{ steps.release.outputs.tag }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          sha256sum "dart-source-${TAG}.tar.xz" \
            > "dart-source-${TAG}.tar.xz.sha256"

      - name: Show workspace files (debug)
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          echo "Listing files in workspace:"
          ls -la "$GITHUB_WORKSPACE" | sed -n '1,200p'

      - name: Create and push release tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG"
          git push origin "$TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Dart Source ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dart-source-${{ steps.release.outputs.tag }}.tar.xz
            dart-source-${{ steps.release.outputs.tag }}.tar.xz.sha256
